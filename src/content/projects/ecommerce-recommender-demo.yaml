      detail: Generated data
    - label: Five models
      detail: Run in memory
    - label: Streamlit demo
      detail: Side-by-side comparison
    - label: Front-end component
      detail: Next.js and TypeScript
implementation:
  needs:
    - The five models (for example popularity, item-based collaborative filtering, matrix factorisation, content-based, hybrid)
    - How the front-end component consumes recommendations
validation:
  needs:
    - Offline metrics on a held-out split of the synthetic data (precision at k, recall at k, coverage), with a popularity baseline
results:
