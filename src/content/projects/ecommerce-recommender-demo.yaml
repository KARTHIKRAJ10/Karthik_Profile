preview: recommender
usesSyntheticData: true
card:
  problem: Comparing recommendation approaches is hard to explain without something a reviewer can click through.
  solution: A Streamlit demo running five in-memory recommendation models on synthetic data, with a Next.js front-end component and an integration guide.
  result: Demonstration on synthetic data. Not a measure of real-world performance.
  resultStatus: simulated
summary:
  problem: >-
    Recommendation methods trade off differently on new users, popular items and
    catalogue coverage. A static write-up does not show that.
  solution: >-
    A Streamlit application that runs five recommendation models in memory on synthetic
    data so they can be compared side by side, plus a Next.js and TypeScript front-end
    component and an integration README.
  outcome: A working demonstration. All data is synthetic, so the outputs illustrate behaviour and are not performance claims.
context:
  text: Independent portfolio project built to demonstrate recommender methods.
contribution:
  text: Sole author.
data:
  points:
    - Synthetic users, items and interactions generated for the demo.
  needs:
    - How the synthetic data is generated and its size
architecture:
  caption: Demo structure.
  stages:
